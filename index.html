to."},{id:"ol-6",title:"Sapiens. Da animali a d\xE8i",author:"Yuval Noah Harari",year:2011,status:"read",rating:4,genre:"Saggistica",kind:"nonfiction",coverUrl:"https://covers.openlibrary.org/b/id/8406786-M.jpg",fallbackColor:"#374151",startDate:"2026-08-20",endDate:"2026-09-14",description:"Un viaggio affascinante lungo centomila anni di storia umana: dalla rivoluzione cognitiva a quella agricola e scientifica, esplorando come i miti condivisi abbiano permesso a Homo sapiens di dominare il pianeta.",notes:"Ottimi spunti sul ruolo delle finzioni condivise (denaro, nazioni, leggi)."},{id:"ol-7",title:"Le citt\xE0 invisibili",author:"Italo Calvino",year:1972,status:"wishlist",rating:0,genre:"Classici Italiani",kind:"fiction",coverUrl:"https://covers.openlibrary.org/b/id/8259301-M.jpg",fallbackColor:"#9A3412",startDate:"",endDate:"",description:"Marco Polo descrive all\u2019imperatore Kublai Khan cinquantacinque citt\xE0 immaginarie dagli evocativi nomi femminili, riflettendo sulla memoria, sul desiderio e sull\u2019essenza stessa del vivere urbano.",notes:"In lista per le letture invernali."},{id:"ol-8",title:"Il problema dei tre corpi",author:"Cixin Liu",year:2006,status:"wishlist",rating:0,genre:"Fantascienza",kind:"fiction",coverUrl:"https://covers.openlibrary.org/b/id/8315386-M.jpg",fallbackColor:"#1E293B",startDate:"",endDate:"",description:"Durante la Rivoluzione Culturale cinese, un progetto militare segreto invia segnali nello spazio per contattare civilt\xE0 extraterrestri. Decenni dopo, una civilt\xE0 sull\u2019orlo dell\u2019estinzione si prepara a invadere la Terra.",notes:""},{id:"ol-9",title:"Ulisse",author:"James Joyce",year:1922,status:"abandoned",rating:3,genre:"Classici",kind:"fiction",coverUrl:"https://covers.openlibrary.org/b/id/8235116-M.jpg",fallbackColor:"#4B5563",startDate:"2026-05-01",endDate:"",description:"Il 16 giugno 1904 a Dublino: le peregrinazioni fisiche e interiori di Leopold Bloom, Stephen Dedalus e Molly Bloom narrate attraverso una
